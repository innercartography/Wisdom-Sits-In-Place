<!doctype html>
<html><head><meta charset="utf-8"><title>splat viewer</title>
<script type="importmap">{"imports":{"three":"./three/build/three.module.js","three/addons/":"./three/examples/jsm/","@sparkjsdev/spark":"./spark/dist/spark.module.js"}}</script>
<style>html,body{margin:0;background:#000}</style>
</head><body>
<script type="module">
import * as THREE from 'three';
import { SparkRenderer, SplatMesh } from '@sparkjsdev/spark';
const W = 1280, H = 720;
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setSize(W, H, false); renderer.setPixelRatio(1);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.add(new SparkRenderer({ renderer }));
const camera = new THREE.PerspectiveCamera(58.715, W / H, 0.05, 2000);
const splat = new SplatMesh({ url: './scene.spz' });
scene.add(splat);
await splat.initialized;
window.ready = true;
// cam: {position:[x,y,z], quaternion:[x,y,z,w]} in the Atlas "rub" world (same as three.js camera axes)
window.shoot = async (cam) => {
  camera.position.fromArray(cam.position);
  camera.quaternion.fromArray(cam.quaternion);
  camera.updateMatrixWorld();
  for (let i = 0; i < 40; i++) { renderer.render(scene, camera); await new Promise(r => setTimeout(r, 50)); }
  return renderer.domElement.toDataURL('image/png');
};
</script></body></html>
